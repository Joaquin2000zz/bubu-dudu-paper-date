<!doctype html><html lang="es"><meta charset="utf-8"><title>Bubu & Dudu · estudio de movimiento</title>
<style>body{margin:32px;background:#f8edd5;color:#604536;font-family:Georgia,serif}h1{font-size:30px}.grid{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:14px}.card{background:#fff9e9;padding:14px;text-align:center;border:1px solid #d3bd98;border-radius:4px}.card svg{width:100%;height:200px}.card small{font-family:system-ui;font-size:11px;display:block}h2{margin-top:28px}@media(min-width:1100px){.grid{grid-template-columns:repeat(6,1fr)}}</style>
<h1>El mismo personaje, en cada movimiento.</h1><p>Frente · tres cuartos · espalda · caminar · regalar · besar</p><main></main>
<script src="../src/characters.js"></script><script>
const poses=[['front','idle','Frente'],['side','idle','Tres cuartos'],['back','idle','Espalda'],['side','walk','Caminar'],['side','give','Entregar flores'],['side','kiss','Besar']];
for(const name of ['Bubu','Dudu']){const section=document.createElement('section');section.innerHTML='<h2>'+name+'</h2><div class="grid">'+poses.map(([v,a,label])=>'<div class="card"><svg viewBox="0 0 260 300" data-name="'+name+'" data-view="'+v+'" data-action="'+a+'"></svg><small>'+label+'</small></div>').join('')+'</div>';document.querySelector('main').append(section)}
function draw(t){document.querySelectorAll('svg').forEach(el=>{const {name,view,action}=el.dataset;const frame=action==='walk'?Math.floor(t/90)%8:Math.floor(t/350)%4;el.innerHTML=PaperCharacters.svg(name,view,action,frame)});requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
