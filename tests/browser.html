<!doctype html>
<html lang="es">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio de Bubu & Dudu</title>
<style>body{font:14px system-ui;background:#fff8e5;color:#513b32;margin:16px}button,select{padding:10px;margin:4px}iframe{width:100%;height:72vh;border:1px solid #bc9c75}pre{white-space:pre-wrap}</style>
<h1>Laboratorio de juego</h1>
<p>Inspección manual de niveles, controles y acciones. <a href="animation-review.html">Galería de dibujos</a></p>
<select id="actor"><option>Dudu</option><option>Bubu</option></select>
<button data-level="1">Valle</button><button data-level="2">Bosque</button><button data-level="3">Jardín</button>
<button id="near">Acercar pareja + seis ramos</button><button id="jump">Saltar</button><button id="flowers">Dar ramo</button><button id="kiss">Beso</button>
<pre id="state">Cargando…</pre><iframe id="game" src="../index.html?test=1"></iframe>
<script type="module">
const frame=document.querySelector('#game'),output=document.querySelector('#state');
const api=()=>frame.contentWindow.__BUBU_DUDU_PAPER_DATE__;
for(const button of document.querySelectorAll('[data-level]'))button.onclick=()=>{
  api().start(document.querySelector('#actor').value);api().loadLevel(Number(button.dataset.level));
};
document.querySelector('#near').onclick=()=>{
  const game=api();if(game.state.mode==='menu')game.start(document.querySelector('#actor').value);
  game.loadLevel(3);for(let i=0;i<6;i++)game.state.inventory.collect('lab-'+i);game.debugNear();
};
for(const [button,action] of [['jump','jump'],['flowers','giveFlowers'],['kiss','kiss']])document.querySelector('#'+button).onclick=()=>api()[action]();
setInterval(()=>{
  const game=api();if(!game)return;
  const s=game.state,p=game.positions[s.player];
  output.textContent=JSON.stringify({nivel:s.level,estado:s.mode,ramos:s.flowers,disponibles:s.inventory.available,personaje:p?{x:p.x,z:p.z,salto:p.jumpY,velocidadVertical:p.jumpV,sueloBase:p.jumpBase}:null},null,2);
},200);
</script>
</html>
